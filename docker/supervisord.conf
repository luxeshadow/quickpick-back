[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/quickpick-supervisor.pid

[program:apache]
command=apache2-foreground
directory=/var/www/html
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:face-service]
command=/opt/face-venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 1 --limit-concurrency 4 --no-access-log
directory=/opt/face-service
user=www-data
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/opt/face-venv/bin/python /var/www/html/docker/wait_for_services.py php artisan queue:work --queue=face-processing,default --tries=5 --timeout=120 --sleep=3 --max-time=3600
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
