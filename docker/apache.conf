<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    # Do not record access-link tokens or query parameters in HTTP access logs.
    LogFormat "%h %t %m %>s %b" quickpick
    CustomLog /proc/self/fd/1 quickpick
</VirtualHost>
